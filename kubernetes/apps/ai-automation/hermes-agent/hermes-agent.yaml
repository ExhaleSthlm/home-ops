---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-agent-data
  namespace: ai-automation
  labels:
    backup.myk8s.se/volume: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-python-overrides
  namespace: ai-automation
data:
  sitecustomize.py: |
    """Cluster-local Python startup overrides for Hermes."""

    import urllib.request


    # Cloudflare is returning HTTP 403 to Python's default urllib user agent
    # during JWKS fetches. Install a browser-like default opener so Hermes'
    # PyJWKClient can resolve Authentik keys reliably.
    _opener = urllib.request.build_opener()
    _opener.addheaders = [
        ("User-Agent", "Mozilla/5.0 Hermes-JWKS-Workaround"),
    ]
    urllib.request.install_opener(_opener)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config-bootstrap
  namespace: ai-automation
data:
  ensure-hermes-config.py: |
    from copy import deepcopy
    import os
    from pathlib import Path
    import tempfile

    import yaml


    CONFIG_PATH = Path(os.getenv("HERMES_CONFIG_PATH", "/opt/data/config.yaml"))

    MANAGED_PROVIDERS = {
        "ollama-fast": {
            "name": "ollama-fast",
            "api": "http://ollama-fast.ai-automation.svc.cozy.local:11434",
            "default_model": "llama3.2:3b",
            "models": {
                "llama3.2:3b": {"context_length": 131072},
                "qwen3:1.7b": {"context_length": 40960},
            },
        },
        "ollama-default": {
            "name": "ollama-default",
            "api": "http://ollama-default.ai-automation.svc.cozy.local:11434",
            "default_model": "llama3.1:8b",
            "models": {
                "llama3.1:8b": {"context_length": 131072},
            },
        },
    }
    MANAGED = {
        "agent": {
            "reasoning_effort": "low",
        },
        "security": {
            "tirith_fail_open": False,
        },
    }
    DEFAULTS = {
        "auxiliary": {
        "compression": {
            "provider": "openrouter",
            "model": "google/gemini-2.5-flash-lite",
            "base_url": "",
            "api_key": "",
            "timeout": 120,
        },
        "web_extract": {
            "provider": "openrouter",
            "model": "google/gemini-2.5-flash-lite",
            "base_url": "",
            "api_key": "",
            "timeout": 360,
        },
        "mcp": {
            "provider": "openrouter",
            "model": "openai/gpt-5.1-codex-mini",
            "base_url": "",
            "api_key": "",
            "timeout": 30,
        },
        "approval": {
            "provider": "openrouter",
            "model": "openai/gpt-5.1-codex-mini",
            "base_url": "",
            "api_key": "",
            "timeout": 30,
        },
        "title_generation": {
            "provider": "ollama-fast",
            "model": "llama3.2:3b",
            "base_url": "",
            "api_key": "",
            "timeout": 30,
        },
        "triage_specifier": {
            "provider": "ollama-fast",
            "model": "llama3.2:3b",
            "base_url": "",
            "api_key": "",
            "timeout": 120,
        },
        "kanban_decomposer": {
            "provider": "ollama-fast",
            "model": "llama3.2:3b",
            "base_url": "",
            "api_key": "",
            "timeout": 180,
        },
        "skills_hub": {
            "provider": "ollama-default",
            "model": "llama3.1:8b",
            "base_url": "",
            "api_key": "",
            "timeout": 30,
        },
        "profile_describer": {
            "provider": "ollama-default",
            "model": "llama3.1:8b",
            "base_url": "",
            "api_key": "",
            "timeout": 60,
        },
        "curator": {
            "provider": "ollama-default",
            "model": "llama3.1:8b",
            "base_url": "",
            "api_key": "",
            "timeout": 600,
        },
        },
        "display": {
            "personality": "helpful",
        },
        "sessions": {
            "auto_prune": True,
        },
        "moa": {
            "default_preset": "homelab-balanced",
            "presets": {
                "homelab-balanced": {
                    "enabled": True,
                    "reference_models": [
                        {
                            "provider": "ollama-fast",
                            "model": "llama3.2:3b",
                        },
                        {
                            "provider": "openrouter",
                            "model": "google/gemini-2.5-flash-lite",
                        },
                    ],
                    "aggregator": {
                        "provider": "openrouter",
                        "model": "openai/gpt-5.1-codex-mini",
                    },
                    "reference_temperature": None,
                    "aggregator_temperature": None,
                    "max_tokens": 4096,
                    "reference_max_tokens": 800,
                    "fanout": "user_turn",
                },
            },
        },
    }
    LEGACY_PROVIDER_REFERENCES = {
        "custom:ollama-fast": "ollama-fast",
        "custom:ollama-default": "ollama-default",
    }


    def deep_defaults(target, defaults):
        for key, value in defaults.items():
            if key not in target:
                target[key] = deepcopy(value)
            elif isinstance(target[key], dict) and isinstance(value, dict):
                deep_defaults(target[key], value)


    def apply_managed(config):
        providers = config.setdefault("providers", {})
        if not isinstance(providers, dict):
            providers = {}
            config["providers"] = providers

        for name, wanted in MANAGED_PROVIDERS.items():
            provider = providers.get(name)
            if not isinstance(provider, dict):
                provider = {}
                providers[name] = provider

            for key in ("name", "api", "default_model"):
                provider[key] = wanted[key]

            current_models = provider.get("models")
            if not isinstance(current_models, dict):
                current_models = {}
            managed_models = {}
            for model_name, model_settings in wanted["models"].items():
                current = current_models.get(model_name)
                if not isinstance(current, dict):
                    current = {}
                current.update(model_settings)
                managed_models[model_name] = current
            provider["models"] = managed_models

        for section, values in MANAGED.items():
            target = config.get(section)
            if not isinstance(target, dict):
                target = {}
                config[section] = target
            target.update(values)


    def migrate_legacy_providers(config):
        legacy = config.get("custom_providers")
        if isinstance(legacy, list):
            retained = [
                entry for entry in legacy
                if not isinstance(entry, dict)
                or str(entry.get("name", "")).strip() not in MANAGED_PROVIDERS
            ]
            if retained:
                config["custom_providers"] = retained
            else:
                config.pop("custom_providers", None)


    def migrate_references(value):
        if isinstance(value, dict):
            for key, item in value.items():
                value[key] = migrate_references(item)
        elif isinstance(value, list):
            for index, item in enumerate(value):
                value[index] = migrate_references(item)
        elif isinstance(value, str):
            return LEGACY_PROVIDER_REFERENCES.get(value, value)
        return value


    def atomic_write(config):
        stat = CONFIG_PATH.stat()
        with tempfile.NamedTemporaryFile(
            mode="w",
            dir=CONFIG_PATH.parent,
            prefix=f".{CONFIG_PATH.name}.",
            delete=False,
        ) as temporary:
            yaml.safe_dump(config, temporary, sort_keys=False, allow_unicode=False)
            temporary.flush()
            os.fsync(temporary.fileno())
            temporary_path = Path(temporary.name)

        os.chmod(temporary_path, stat.st_mode)
        os.chown(temporary_path, stat.st_uid, stat.st_gid)
        os.replace(temporary_path, CONFIG_PATH)


    with CONFIG_PATH.open() as config_file:
        config = yaml.safe_load(config_file) or {}
    if not isinstance(config, dict):
        raise TypeError(f"Hermes config must be a mapping: {CONFIG_PATH}")

    original = deepcopy(config)
    apply_managed(config)
    deep_defaults(config, DEFAULTS)
    migrate_legacy_providers(config)
    migrate_references(config)

    if config != original:
        atomic_write(config)
        print("updated Hermes hybrid bootstrap state")
    else:
        print("Hermes config already up to date")
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-hermes-agent-env
  namespace: ai-automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: hermes-agent-env
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          reloader.stakater.com/auto: "true"
  data:
    - secretKey: HOME_ASSISTANT_TOKEN
      remoteRef:
        key: /HERMES/HOME_ASSISTANT_TOKEN
    - secretKey: HASS_TOKEN
      remoteRef:
        key: /HERMES/HOME_ASSISTANT_TOKEN
    - secretKey: HOME_ASSISTANT_URL
      remoteRef:
        key: /HERMES/HOME_ASSISTANT_URL
    - secretKey: HASS_URL
      remoteRef:
        key: /HERMES/HOME_ASSISTANT_URL
    - secretKey: HERMES_DASHBOARD_OIDC_CLIENT_ID
      remoteRef:
        key: /HERMES/DASHBOARD_OIDC_CLIENT_ID
    - secretKey: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
      remoteRef:
        key: /HERMES/DASHBOARD_OIDC_CLIENT_SECRET
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: /HERMES/OPENROUTER_API_KEY
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent
  namespace: ai-automation
  labels:
    sharding.fluxcd.io/key: shard0
  annotations:
    lineage.cozystack.io/ignore: "true"
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: cozy-fluxcd
  install:
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      hermes-agent:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          ensure-hermes-config:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.8.16.2@sha256:00a3150dc11dbb3293ed524d1f905c84d3d0c934725125e0b29abe196288fa98
              pullPolicy: IfNotPresent
            command:
              - /bin/sh
              - -ec
            args:
              - |
                /opt/hermes/.venv/bin/hermes config migrate
                /opt/hermes/.venv/bin/python /opt/hermes-bootstrap/ensure-hermes-config.py
                /opt/hermes/.venv/bin/hermes config check
            securityContext:
              runAsUser: 0
              runAsGroup: 0
        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.8.16.2@sha256:00a3150dc11dbb3293ed524d1f905c84d3d0c934725125e0b29abe196288fa98
              pullPolicy: IfNotPresent
            args:
              - gateway
              - run
            env:
              - name: TZ
                value: ${TZ}
              - name: HERMES_DASHBOARD
                value: "1"
              - name: HERMES_DASHBOARD_HOST
                value: 0.0.0.0
              - name: HERMES_DASHBOARD_PORT
                value: "9119"
              - name: HERMES_DASHBOARD_PUBLIC_URL
                value: "https://hermes.${DOMAIN}"
              - name: PYTHONPATH
                value: "/opt/hermes-overrides"
              - name: HERMES_DASHBOARD_OIDC_ISSUER
                value: "https://auth.${DOMAIN}/application/o/hermes/"
              - name: HERMES_DASHBOARD_OIDC_SCOPES
                value: "openid profile email offline_access"
            envFrom:
              - secretRef:
                  name: hermes-agent-env
            ports:
              - name: dashboard
                containerPort: 9119
            resources:
              requests:
                cpu: "2"
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 1Gi
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false

    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: hermes-agent-data
        globalMounts:
          - path: /opt/data
      python-overrides:
        type: configMap
        name: hermes-agent-python-overrides
        globalMounts:
          - path: /opt/hermes-overrides/sitecustomize.py
            subPath: sitecustomize.py
            readOnly: true
      hermes-bootstrap:
        type: configMap
        name: hermes-agent-config-bootstrap
        globalMounts:
          - path: /opt/hermes-bootstrap/ensure-hermes-config.py
            subPath: ensure-hermes-config.py
            readOnly: true

    service:
      hermes-agent:
        controller: hermes-agent
        annotations:
          external-dns.alpha.kubernetes.io/internal: "true"
          external-dns.alpha.kubernetes.io/technitium: "true"
          external-dns.alpha.kubernetes.io/hostname: "hermes.${DOMAIN}"
          external-dns.alpha.kubernetes.io/target: "cluster-ingress.${DOMAIN}"
        ports:
          http:
            port: 9119
            targetPort: dashboard

    ingress:
      hermes-agent:
        enabled: true
        className: tenant-root
        annotations:
          lineage.cozystack.io/ignore: "true"
          external-dns.alpha.kubernetes.io/target: ${CLOUDFLARE_TUNNEL_TARGET}
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          external-dns.alpha.kubernetes.io/hostname: "hermes.${DOMAIN}"
        hosts:
          - host: hermes.${DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: hermes-agent
                  port: 9119
        tls:
          - secretName: wildcard-le-tls-cert
            hosts:
              - hermes.${DOMAIN}
