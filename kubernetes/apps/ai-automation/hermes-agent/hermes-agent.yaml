---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-agent-data
  namespace: ai-automation
  labels:
    backup.myk8s.se/volume: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-python-overrides
  namespace: ai-automation
data:
  sitecustomize.py: |
    """Cluster-local Python startup overrides for Hermes."""

    import urllib.request


    # Cloudflare is returning HTTP 403 to Python's default urllib user agent
    # during JWKS fetches. Install a browser-like default opener so Hermes'
    # PyJWKClient can resolve Authentik keys reliably.
    _opener = urllib.request.build_opener()
    _opener.addheaders = [
        ("User-Agent", "Mozilla/5.0 Hermes-JWKS-Workaround"),
    ]
    urllib.request.install_opener(_opener)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config-bootstrap
  namespace: ai-automation
data:
  ensure-custom-providers.py: |
    from pathlib import Path
    import yaml


    CONFIG_PATH = Path("/opt/data/config.yaml")

    WANTED = {
        "ollama-fast": {
            "name": "ollama-fast",
            "base_url": "http://ollama-fast.ai-automation.svc.cozy.local:11434",
            "model": "llama3.2:3b",
            "models": {
                "llama3.2:3b": {"context_length": 131072},
                "qwen3:1.7b": {"context_length": 40960},
            },
        },
        "ollama-default": {
            "name": "ollama-default",
            "base_url": "http://ollama-default.ai-automation.svc.cozy.local:11434",
            "model": "llama3.1:8b",
            "models": {
                "llama3.1:8b": {"context_length": 131072},
            },
        },
    }
    AUXILIARY = {
        "compression": {
            "provider": "openrouter",
            "model": "google/gemini-2.5-flash-lite",
            "base_url": "",
            "api_key": "",
            "timeout": 120,
        },
        "web_extract": {
            "provider": "openrouter",
            "model": "google/gemini-2.5-flash-lite",
            "base_url": "",
            "api_key": "",
            "timeout": 360,
        },
        "mcp": {
            "provider": "openrouter",
            "model": "openai/gpt-5.1-codex-mini",
            "base_url": "",
            "api_key": "",
            "timeout": 30,
        },
        "approval": {
            "provider": "openrouter",
            "model": "openai/gpt-5.1-codex-mini",
            "base_url": "",
            "api_key": "",
            "timeout": 30,
        },
        "title_generation": {
            "provider": "custom:ollama-fast",
            "model": "llama3.2:3b",
            "base_url": "",
            "api_key": "",
            "timeout": 30,
        },
        "triage_specifier": {
            "provider": "custom:ollama-fast",
            "model": "llama3.2:3b",
            "base_url": "",
            "api_key": "",
            "timeout": 120,
        },
        "kanban_decomposer": {
            "provider": "custom:ollama-fast",
            "model": "llama3.2:3b",
            "base_url": "",
            "api_key": "",
            "timeout": 180,
        },
        "skills_hub": {
            "provider": "custom:ollama-default",
            "model": "llama3.1:8b",
            "base_url": "",
            "api_key": "",
            "timeout": 30,
        },
        "profile_describer": {
            "provider": "custom:ollama-default",
            "model": "llama3.1:8b",
            "base_url": "",
            "api_key": "",
            "timeout": 60,
        },
        "curator": {
            "provider": "custom:ollama-default",
            "model": "llama3.1:8b",
            "base_url": "",
            "api_key": "",
            "timeout": 600,
        },
    }

    MOA_PRESET_NAME = "homelab-balanced"
    MOA_PRESET = {
        "enabled": True,
        "reference_models": [
            {
                "provider": "custom:ollama-fast",
                "model": "llama3.2:3b",
            },
            {
                "provider": "openrouter",
                "model": "google/gemini-2.5-flash-lite",
            },
        ],
        "aggregator": {
            "provider": "openrouter",
            "model": "openai/gpt-5.1-codex-mini",
        },
        "reference_temperature": None,
        "aggregator_temperature": None,
        "max_tokens": 4096,
        "reference_max_tokens": 800,
        "fanout": "user_turn",
    }
    DISPLAY = {
        "personality": "helpful",
    }
    SECURITY = {
        "tirith_fail_open": False,
    }
    SESSIONS = {
        "auto_prune": True,
    }


    with CONFIG_PATH.open() as f:
        config = yaml.safe_load(f) or {}

    changed = False

    if "toolsets" in config:
        del config["toolsets"]
        changed = True

    providers = config.get("custom_providers")
    if not isinstance(providers, list):
        providers = []

    by_name = {
        str(entry.get("name", "")).strip(): entry
        for entry in providers
        if isinstance(entry, dict)
    }

    for name, wanted in WANTED.items():
        existing = by_name.get(name)
        if existing is None:
            providers.append(wanted)
            changed = True
            continue

        for key in ("name", "base_url", "model"):
            if existing.get(key) != wanted[key]:
                existing[key] = wanted[key]
                changed = True

        models = existing.get("models")
        if not isinstance(models, dict):
            models = {}

        for model_name, model_cfg in wanted["models"].items():
            if models.get(model_name) != model_cfg:
                models[model_name] = model_cfg
                changed = True

        existing["models"] = models

    if changed:
        config["custom_providers"] = providers

    auxiliary = config.get("auxiliary")
    if not isinstance(auxiliary, dict):
        auxiliary = {}

    for slot, wanted in AUXILIARY.items():
        current = auxiliary.get(slot)
        if not isinstance(current, dict):
            auxiliary[slot] = dict(wanted)
            changed = True
            continue
        for key, value in wanted.items():
            if current.get(key) != value:
                current[key] = value
                changed = True

    display = config.get("display")
    if not isinstance(display, dict):
        display = {}
    for key, value in DISPLAY.items():
        if display.get(key) != value:
            display[key] = value
            changed = True

    security = config.get("security")
    if not isinstance(security, dict):
        security = {}
    for key, value in SECURITY.items():
        if security.get(key) != value:
            security[key] = value
            changed = True

    sessions = config.get("sessions")
    if not isinstance(sessions, dict):
        sessions = {}
    for key, value in SESSIONS.items():
        if sessions.get(key) != value:
            sessions[key] = value
            changed = True

    moa = config.get("moa")
    if not isinstance(moa, dict):
        moa = {}

    presets = moa.get("presets")
    if not isinstance(presets, dict):
        presets = {}

    current_preset = presets.get(MOA_PRESET_NAME)
    if current_preset != MOA_PRESET:
        presets[MOA_PRESET_NAME] = dict(MOA_PRESET)
        changed = True

    if moa.get("default_preset") != MOA_PRESET_NAME:
        moa["default_preset"] = MOA_PRESET_NAME
        changed = True

    if moa.get("presets") != presets:
        moa["presets"] = presets
        changed = True

    if changed:
        config["custom_providers"] = providers
        config["auxiliary"] = auxiliary
        config["display"] = display
        config["security"] = security
        config["sessions"] = sessions
        config["moa"] = moa
        with CONFIG_PATH.open("w") as f:
            yaml.safe_dump(config, f, sort_keys=False, allow_unicode=False)
        print("updated Hermes config bootstrap state")
    else:
        print("Hermes config already up to date")
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-hermes-agent-env
  namespace: ai-automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: hermes-agent-env
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          reloader.stakater.com/auto: "true"
  data:
    - secretKey: HOME_ASSISTANT_TOKEN
      remoteRef:
        key: /HERMES/HOME_ASSISTANT_TOKEN
    - secretKey: HOME_ASSISTANT_URL
      remoteRef:
        key: /HERMES/HOME_ASSISTANT_URL
    - secretKey: HERMES_DASHBOARD_OIDC_CLIENT_ID
      remoteRef:
        key: /HERMES/DASHBOARD_OIDC_CLIENT_ID
    - secretKey: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
      remoteRef:
        key: /HERMES/DASHBOARD_OIDC_CLIENT_SECRET
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: /HERMES/OPENROUTER_API_KEY
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent
  namespace: ai-automation
  annotations:
    lineage.cozystack.io/ignore: "true"
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: cozy-fluxcd
  install:
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      hermes-agent:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          ensure-hermes-config:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.8.16.2@sha256:00a3150dc11dbb3293ed524d1f905c84d3d0c934725125e0b29abe196288fa98
              pullPolicy: IfNotPresent
            command:
              - /opt/hermes/.venv/bin/python
              - /opt/hermes-bootstrap/ensure-custom-providers.py
            securityContext:
              runAsUser: 0
              runAsGroup: 0
        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.8.16.2@sha256:00a3150dc11dbb3293ed524d1f905c84d3d0c934725125e0b29abe196288fa98
              pullPolicy: IfNotPresent
            args:
              - gateway
              - run
            env:
              - name: TZ
                value: ${TZ}
              - name: HERMES_DASHBOARD
                value: "1"
              - name: HERMES_DASHBOARD_HOST
                value: 0.0.0.0
              - name: HERMES_DASHBOARD_PORT
                value: "9119"
              - name: HERMES_DASHBOARD_PUBLIC_URL
                value: "https://hermes.${DOMAIN}"
              - name: PYTHONPATH
                value: "/opt/hermes-overrides"
              - name: HERMES_DASHBOARD_OIDC_ISSUER
                value: "https://auth.${DOMAIN}/application/o/hermes/"
              - name: HERMES_DASHBOARD_OIDC_SCOPES
                value: "openid profile email offline_access"
            envFrom:
              - secretRef:
                  name: hermes-agent-env
            ports:
              - name: dashboard
                containerPort: 9119
            resources:
              requests:
                cpu: "2"
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 1Gi
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false

    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: hermes-agent-data
        globalMounts:
          - path: /opt/data
      python-overrides:
        type: configMap
        name: hermes-agent-python-overrides
        globalMounts:
          - path: /opt/hermes-overrides/sitecustomize.py
            subPath: sitecustomize.py
            readOnly: true
      hermes-bootstrap:
        type: configMap
        name: hermes-agent-config-bootstrap
        globalMounts:
          - path: /opt/hermes-bootstrap/ensure-custom-providers.py
            subPath: ensure-custom-providers.py
            readOnly: true

    service:
      hermes-agent:
        controller: hermes-agent
        annotations:
          external-dns.alpha.kubernetes.io/internal: "true"
          external-dns.alpha.kubernetes.io/technitium: "true"
          external-dns.alpha.kubernetes.io/hostname: "hermes.${DOMAIN}"
          external-dns.alpha.kubernetes.io/target: "cluster-ingress.${DOMAIN}"
        ports:
          http:
            port: 9119
            targetPort: dashboard

    ingress:
      hermes-agent:
        enabled: true
        className: tenant-root
        annotations:
          lineage.cozystack.io/ignore: "true"
          external-dns.alpha.kubernetes.io/target: ${CLOUDFLARE_TUNNEL_TARGET}
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          external-dns.alpha.kubernetes.io/hostname: "hermes.${DOMAIN}"
        hosts:
          - host: hermes.${DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: hermes-agent
                  port: 9119
        tls:
          - secretName: wildcard-le-tls-cert
            hosts:
              - hermes.${DOMAIN}
