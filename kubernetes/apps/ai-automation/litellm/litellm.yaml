---
# Compatibility alias for clients that used LiteLLM before it became a shared service.
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai-automation
spec:
  type: ExternalName
  externalName: litellm.ai-gateway.svc.cozy.local
  ports:
    - name: http
      port: 4000
      targetPort: 4000
