---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wyoming-kokoro-sv-openvino
  namespace: home-automation
data:
  server.py: |
    import asyncio
    import hashlib
    import json
    import logging
    import os
    import re
    import subprocess
    import time
    from functools import partial
    from pathlib import Path
    from urllib.request import urlopen

    import numpy as np
    import onnxruntime as ort
    from pykokoro import GenerationConfig, KokoroSynthesizer, SynthesisConfig
    from wyoming.audio import AudioChunk, AudioStart, AudioStop
    from wyoming.error import Error
    from wyoming.event import Event
    from wyoming.info import Attribution, Describe, Info, TtsProgram, TtsVoice
    from wyoming.server import AsyncEventHandler, AsyncServer
    from wyoming.tts import (
        Synthesize,
        SynthesizeChunk,
        SynthesizeStart,
        SynthesizeStop,
        SynthesizeStopped,
    )

    logging.basicConfig(level=os.getenv("LOG_LEVEL", "INFO"))
    LOGGER = logging.getLogger("wyoming-kokoro-sv-openvino")
    DEFAULT_VOICE = os.getenv("KOKORO_SV_DEFAULT_VOICE", "Stina")
    SAMPLE_RATE = 24000
    MAX_SEGMENT_CHARS = 240
    SYNTHESIS_LOCK = asyncio.Lock()
    VOICES = (
        "Alice",
        "Anton",
        "Björn",
        "Ebba",
        "Elsa",
        "Greta",
        "Lars",
        "Nils",
        "Oskar",
        "Stina",
    )
    MODEL_RELEASE_URL = (
        "https://github.com/buchwandler/kokoro-onnx-models/releases/download/"
        "model-files-swedish-v1.1-r2"
    )
    MODEL_ASSETS = {
        "config-swedish-v1.1.json": (
            "5abb01e2403b072bf03d04fde160443e209d7a0dad49a423be15196b9b43c17f"
        ),
        "kokoro-swedish-v1.1.onnx": (
            "33b63b9606818e85da054735c8da1bb55c68decc5f28ceaff257a18b09b3d6e1"
        ),
        "voices-swedish-v1.1.npz": (
            "7e6f98ad71ceca5b6eb187f1cde8c64af10614d42bed44004cf41f286979a526"
        ),
    }


    def trim_edge_silence(audio):
        samples = np.asarray(audio, dtype=np.float32).reshape(-1)
        active = np.flatnonzero(np.abs(samples) > 0.01)
        if not active.size:
            return samples

        leading_padding = int(SAMPLE_RATE * 0.08)
        trailing_padding = int(SAMPLE_RATE * 0.22)
        start = max(0, int(active[0]) - leading_padding)
        end = min(len(samples), int(active[-1]) + 1 + trailing_padding)
        return samples[start:end]


    def sha256_file(path):
        digest = hashlib.sha256()
        with path.open("rb") as model_file:
            while chunk := model_file.read(1024 * 1024):
                digest.update(chunk)
        return digest.hexdigest()


    def download_model_assets():
        model_dir = Path("/data/models/sv-joakim-v1.1-r2")
        model_dir.mkdir(parents=True, exist_ok=True)
        for filename, expected_hash in MODEL_ASSETS.items():
            target = model_dir / filename
            if target.is_file() and sha256_file(target) == expected_hash:
                continue

            temporary = target.with_suffix(target.suffix + ".part")
            LOGGER.info("Downloading model asset: %s", filename)
            digest = hashlib.sha256()
            with urlopen(f"{MODEL_RELEASE_URL}/{filename}") as response:
                with temporary.open("wb") as output:
                    while chunk := response.read(1024 * 1024):
                        output.write(chunk)
                        digest.update(chunk)
            if digest.hexdigest() != expected_hash:
                temporary.unlink(missing_ok=True)
                raise ValueError(f"Checksum mismatch for {filename}")
            temporary.replace(target)

        return model_dir


    def split_all_segments(text):
        remaining = " ".join(text.strip().splitlines())
        segments = []
        while remaining:
            if len(remaining) <= MAX_SEGMENT_CHARS:
                segments.append(remaining)
                break

            end = remaining.rfind(" ", 0, MAX_SEGMENT_CHARS + 1)
            if end <= 0:
                end = MAX_SEGMENT_CHARS
            segments.append(remaining[:end])
            remaining = remaining[end:].lstrip()

        return segments


    def split_complete_segments(text):
        segments = []
        remaining = text.replace("\n", " ")
        while remaining:
            boundary = re.search(r"[.!?](?:\s+|$)", remaining)
            if boundary:
                end = boundary.start() + 1
            elif len(remaining) > MAX_SEGMENT_CHARS:
                end = remaining.rfind(" ", 0, MAX_SEGMENT_CHARS + 1)
                if end <= 0:
                    end = MAX_SEGMENT_CHARS
            else:
                break

            segment = " ".join(remaining[:end].split())
            remaining = remaining[end:].lstrip()
            if segment:
                segments.extend(split_all_segments(segment))

        return segments, remaining


    class KokoroEventHandler(AsyncEventHandler):
        def __init__(self, tts, info, *args, **kwargs):
            super().__init__(*args, **kwargs)
            self.tts = tts
            self.info = info
            self.streaming = False
            self.stream_buffer = ""
            self.stream_voice = None
            self.audio_started = False

        async def handle_event(self, event: Event) -> bool:
            try:
                if Describe.is_type(event.type):
                    await self.write_event(self.info.event())
                    return True

                if SynthesizeStart.is_type(event.type):
                    request = SynthesizeStart.from_event(event)
                    self.streaming = True
                    self.stream_buffer = ""
                    self.stream_voice = request.voice
                    self.audio_started = False
                    return True

                if SynthesizeChunk.is_type(event.type):
                    request = SynthesizeChunk.from_event(event)
                    self.stream_buffer += request.text
                    segments, self.stream_buffer = split_complete_segments(
                        self.stream_buffer
                    )
                    await self.synthesize_segments(segments, self.stream_voice)
                    return True

                if Synthesize.is_type(event.type):
                    request = Synthesize.from_event(event)
                    if self.streaming:
                        if not self.stream_buffer and not self.audio_started:
                            self.stream_buffer = request.text
                        if self.stream_voice is None:
                            self.stream_voice = request.voice
                        return True

                    await self.synthesize_segments(
                        split_all_segments(request.text), request.voice
                    )
                    await self.write_event(AudioStop().event())
                    self.audio_started = False
                    return True

                if SynthesizeStop.is_type(event.type):
                    await self.synthesize_segments(
                        split_all_segments(self.stream_buffer), self.stream_voice
                    )
                    if self.audio_started:
                        await self.write_event(AudioStop().event())
                    await self.write_event(SynthesizeStopped().event())
                    self.streaming = False
                    self.stream_buffer = ""
                    self.stream_voice = None
                    self.audio_started = False
                    return True

                return True
            except Exception as err:
                LOGGER.exception("Kokoro-SV OpenVINO synthesis failed")
                await self.write_event(
                    Error(text=str(err), code=err.__class__.__name__).event()
                )
                return True

        def resolve_voice(self, requested_voice):
            voice = DEFAULT_VOICE
            if requested_voice and requested_voice.name:
                voice = requested_voice.name
            if voice not in VOICES:
                raise ValueError(f"Unknown voice: {voice}")
            return voice

        async def synthesize_segments(self, segments, requested_voice):
            if not segments:
                return

            voice = self.resolve_voice(requested_voice)
            if not self.audio_started:
                await self.write_event(
                    AudioStart(rate=SAMPLE_RATE, width=2, channels=1).event()
                )
                self.audio_started = True

            for text in segments:
                started = time.monotonic()
                async with SYNTHESIS_LOCK:
                    rendered = await asyncio.to_thread(
                        self.tts.synthesize_text,
                        text,
                        language="sv",
                        voice=voice,
                    )
                if rendered.sample_rate != SAMPLE_RATE:
                    raise ValueError(
                        f"Unexpected sample rate: {rendered.sample_rate}"
                    )
                audio = trim_edge_silence(rendered.audio)
                pcm = (
                    np.clip(audio, -1.0, 1.0) * 32767.0
                ).astype("<i2").tobytes()
                elapsed = time.monotonic() - started
                LOGGER.info(
                    "Synthesized voice=%s chars=%d audio=%.2fs elapsed=%.2fs",
                    voice,
                    len(text),
                    len(pcm) / 2 / SAMPLE_RATE,
                    elapsed,
                )

                for offset in range(0, len(pcm), 16384):
                    await self.write_event(
                        AudioChunk(
                            audio=pcm[offset : offset + 16384],
                            rate=SAMPLE_RATE,
                            width=2,
                            channels=1,
                        ).event()
                    )


    def create_synthesizer():
        clinfo = subprocess.run(
            ["/data/intel/bin/clinfo", "-l"],
            check=True,
            capture_output=True,
            text=True,
        )
        if "Device #0" not in clinfo.stdout:
            raise RuntimeError(f"Intel OpenCL GPU unavailable: {clinfo.stdout}")
        LOGGER.info("OpenCL devices:\n%s", clinfo.stdout.strip())

        model_dir = download_model_assets()
        openvino_config = {
            "GPU": {
                "PERFORMANCE_HINT": "LATENCY",
                "NUM_STREAMS": "1",
                "CACHE_DIR": "/data/openvino-cache",
            }
        }
        config = SynthesisConfig(
            voice=DEFAULT_VOICE,
            generation=GenerationConfig(lang="sv"),
            model_variant="sv-joakim",
            model_source="github",
            model_path=model_dir / "kokoro-swedish-v1.1.onnx",
            voices_path=model_dir / "voices-swedish-v1.1.npz",
            model_config_path=model_dir / "config-swedish-v1.1.json",
            provider="openvino",
            provider_options={
                "openvino": {
                    "device_type": "GPU",
                    "load_config": json.dumps(openvino_config),
                }
            },
            cache_dir="/data/pykokoro",
            long_text_split="sentence",
        )
        return KokoroSynthesizer(config)


    async def main():
        LOGGER.info("ONNX Runtime providers: %s", ort.get_available_providers())
        tts = await asyncio.to_thread(create_synthesizer)
        warmup = await asyncio.to_thread(
            tts.synthesize_text,
            "Hej.",
            language="sv",
            voice=DEFAULT_VOICE,
        )
        LOGGER.info(
            "OpenVINO GPU warmup complete: %.2fs audio at %d Hz",
            len(warmup.audio) / warmup.sample_rate,
            warmup.sample_rate,
        )

        attribution = Attribution(
            name="Joakim Eriksson",
            url="https://github.com/joakimeriksson/kokoro-sv",
        )
        info = Info(
            tts=[
                TtsProgram(
                    name="kokoro-sv-openvino",
                    description="Swedish Kokoro-82M ONNX voices on Intel GPU",
                    attribution=attribution,
                    installed=True,
                    version="0.10.6",
                    voices=[
                        TtsVoice(
                            name=voice,
                            description=f"Kokoro-SV OpenVINO: {voice}",
                            attribution=attribution,
                            installed=True,
                            version="0.10.6",
                            languages=["sv"],
                        )
                        for voice in VOICES
                    ],
                    supports_synthesize_streaming=True,
                )
            ]
        )
        LOGGER.info("Available voices: %s", ", ".join(VOICES))

        server = AsyncServer.from_uri("tcp://0.0.0.0:10200")
        await server.run(partial(KokoroEventHandler, tts, info))


    if __name__ == "__main__":
        asyncio.run(main())
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wyoming-kokoro-sv-openvino-data
  namespace: home-automation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wyoming-kokoro-sv-openvino
  namespace: home-automation
spec:
  interval: 30m
  timeout: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: cozy-fluxcd
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      wyoming-kokoro-sv-openvino:
        strategy: Recreate
        annotations:
          configmap.reloader.stakater.com/reload: wyoming-kokoro-sv-openvino
        pod:
          labels:
            home-ops.myk8s.se/config-revision: "1"
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - 44 # video
              - 107 # render
        initContainers:
          install:
            image:
              repository: docker.io/library/python
              tag: 3.15.2-slim-bookworm@sha256:4d54a654d391909a6c0de8035e15c01ad196d31e4a1552bb328bf1181e4d393a
            command:
              - sh
              - -ec
              - |
                if [ ! -x /data/espeak/bin/espeak-ng ]; then
                  sed -i 's|http://|https://|g' /etc/apt/sources.list.d/debian.sources
                  apt-get update
                  apt-get install --no-install-recommends -y espeak-ng
                  install -d /data/espeak/bin /data/espeak/lib
                  cp /usr/bin/espeak-ng /data/espeak/bin/
                  ldd /usr/bin/espeak-ng \
                    | awk '/=> \/.*\.so/{print $3}' \
                    | xargs -I '{}' cp -L '{}' /data/espeak/lib/
                  cp -a /usr/lib/x86_64-linux-gnu/espeak-ng-data /data/espeak/
                  rm -rf /var/lib/apt/lists/*
                fi
                if [ ! -f /data/intel/.opencl-runtime-v2 ]; then
                  sed -i 's|http://|https://|g' /etc/apt/sources.list.d/debian.sources
                  apt-get update
                  apt-get install --no-install-recommends -y \
                    clinfo \
                    intel-opencl-icd \
                    ocl-icd-libopencl1
                  rm -rf /data/intel/bin /data/intel/etc /data/intel/lib
                  install -d \
                    /data/intel/bin \
                    /data/intel/etc/OpenCL/vendors \
                    /data/intel/lib
                  cp /usr/bin/clinfo /data/intel/bin/
                  find /usr/lib/x86_64-linux-gnu -maxdepth 2 \
                    \( -name 'libig*.so*' -o -name 'libOpenCL.so*' \) \
                    -exec cp -L '{}' /data/intel/lib/ \;
                  ldd /usr/bin/clinfo \
                    | awk '/=> \/.*\.so/{print $3}' \
                    | xargs -I '{}' cp -L '{}' /data/intel/lib/
                  for pass in 1 2 3; do
                    for library in /data/intel/lib/*.so*; do
                      LD_LIBRARY_PATH=/data/intel/lib ldd "$library" 2>/dev/null \
                        | awk '/=> \/.*\.so/{print $3}' \
                        | xargs -r -I '{}' cp -L '{}' /data/intel/lib/
                    done
                  done
                  printf '%s\n' '/data/intel/lib/libigdrcl.so' \
                    > /data/intel/etc/OpenCL/vendors/intel.icd
                  touch /data/intel/.opencl-runtime-v2
                  rm -rf /var/lib/apt/lists/*
                fi
                marker=/data/venv/.pykokoro-0.10.6-onnxvoice-0.2.2-wyoming-1.10.2-openvino1
                if [ ! -f "$marker" ]; then
                  python -m venv --clear /data/venv
                  /data/venv/bin/pip install --no-cache-dir \
                    'pykokoro[openvino]==0.10.6' \
                    'onnxvoice[openvino]==0.2.2' \
                    'wyoming==1.10.2'
                  touch "$marker"
                fi
                chown -R 1000:1000 /data
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.15.2-slim-bookworm@sha256:4d54a654d391909a6c0de8035e15c01ad196d31e4a1552bb328bf1181e4d393a
            command:
              - /data/venv/bin/python
              - /app/server.py
            env:
              TZ: ${TZ}
              ESPEAK_DATA_PATH: /data/espeak
              ESPEAKNG_RUNTIME_EXECUTABLE: /data/espeak/bin/espeak-ng
              KOKORO_SV_DEFAULT_VOICE: Stina
              LD_LIBRARY_PATH: /data/espeak/lib:/data/intel/lib
              OCL_ICD_VENDORS: /data/intel/etc/OpenCL/vendors
              XDG_CACHE_HOME: /data/cache
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10200
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 240
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10200
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10200
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 12
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
                gpu.intel.com/i915: 1
              limits:
                cpu: 2
                memory: 3Gi
                gpu.intel.com/i915: 1
    service:
      app:
        controller: wyoming-kokoro-sv-openvino
        type: ClusterIP
        ports:
          wyoming:
            port: 10200
            protocol: TCP
            targetPort: 10200
    persistence:
      data:
        enabled: true
        existingClaim: wyoming-kokoro-sv-openvino-data
        globalMounts:
          - path: /data
      server:
        type: configMap
        name: wyoming-kokoro-sv-openvino
        globalMounts:
          - path: /app/server.py
            subPath: server.py
            readOnly: true
