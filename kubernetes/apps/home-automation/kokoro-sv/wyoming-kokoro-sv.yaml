---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wyoming-kokoro-sv
  namespace: home-automation
data:
  server.py: |
    import asyncio
    import logging
    import os
    import re
    import time
    from functools import partial

    import numpy as np
    from kokoro_sv import SwedishKokoro
    from wyoming.audio import AudioChunk, AudioStart, AudioStop
    from wyoming.error import Error
    from wyoming.event import Event
    from wyoming.info import Attribution, Describe, Info, TtsProgram, TtsVoice
    from wyoming.server import AsyncEventHandler, AsyncServer
    from wyoming.tts import (
        Synthesize,
        SynthesizeChunk,
        SynthesizeStart,
        SynthesizeStop,
        SynthesizeStopped,
    )

    logging.basicConfig(level=os.getenv("LOG_LEVEL", "INFO"))
    LOGGER = logging.getLogger("wyoming-kokoro-sv")
    DEFAULT_VOICE = os.getenv("KOKORO_SV_DEFAULT_VOICE", "Stina")
    SAMPLE_RATE = 24000
    MAX_SEGMENT_CHARS = 240
    SYNTHESIS_LOCK = asyncio.Lock()


    def trim_edge_silence(audio):
        samples = np.asarray(audio, dtype=np.float32)
        active = np.flatnonzero(np.abs(samples) > 0.01)
        if not active.size:
            return samples

        leading_padding = int(SAMPLE_RATE * 0.08)
        trailing_padding = int(SAMPLE_RATE * 0.22)
        start = max(0, int(active[0]) - leading_padding)
        end = min(len(samples), int(active[-1]) + 1 + trailing_padding)
        return samples[start:end]


    def split_all_segments(text):
        remaining = " ".join(text.strip().splitlines())
        segments = []
        while remaining:
            if len(remaining) <= MAX_SEGMENT_CHARS:
                segments.append(remaining)
                break

            end = remaining.rfind(" ", 0, MAX_SEGMENT_CHARS + 1)
            if end <= 0:
                end = MAX_SEGMENT_CHARS
            segments.append(remaining[:end])
            remaining = remaining[end:].lstrip()

        return segments


    def split_complete_segments(text):
        segments = []
        remaining = text.replace("\n", " ")
        while remaining:
            boundary = re.search(r"[.!?](?:\s+|$)", remaining)
            if boundary:
                end = boundary.start() + 1
            elif len(remaining) > MAX_SEGMENT_CHARS:
                end = remaining.rfind(" ", 0, MAX_SEGMENT_CHARS + 1)
                if end <= 0:
                    end = MAX_SEGMENT_CHARS
            else:
                break

            segment = " ".join(remaining[:end].split())
            remaining = remaining[end:].lstrip()
            if segment:
                segments.extend(split_all_segments(segment))

        return segments, remaining


    class KokoroEventHandler(AsyncEventHandler):
        def __init__(self, tts, voices, info, *args, **kwargs):
            super().__init__(*args, **kwargs)
            self.tts = tts
            self.voices = voices
            self.info = info
            self.streaming = False
            self.stream_buffer = ""
            self.stream_voice = None
            self.audio_started = False

        async def handle_event(self, event: Event) -> bool:
            try:
                if Describe.is_type(event.type):
                    await self.write_event(self.info.event())
                    return True

                if SynthesizeStart.is_type(event.type):
                    request = SynthesizeStart.from_event(event)
                    self.streaming = True
                    self.stream_buffer = ""
                    self.stream_voice = request.voice
                    self.audio_started = False
                    return True

                if SynthesizeChunk.is_type(event.type):
                    request = SynthesizeChunk.from_event(event)
                    self.stream_buffer += request.text
                    segments, self.stream_buffer = split_complete_segments(
                        self.stream_buffer
                    )
                    await self.synthesize_segments(segments, self.stream_voice)
                    return True

                if Synthesize.is_type(event.type):
                    request = Synthesize.from_event(event)
                    if self.streaming:
                        # Home Assistant sends this for compatibility after chunks.
                        if not self.stream_buffer and not self.audio_started:
                            self.stream_buffer = request.text
                        if self.stream_voice is None:
                            self.stream_voice = request.voice
                        return True

                    await self.synthesize_segments(
                        split_all_segments(request.text), request.voice
                    )
                    await self.write_event(AudioStop().event())
                    self.audio_started = False
                    return True

                if SynthesizeStop.is_type(event.type):
                    await self.synthesize_segments(
                        split_all_segments(self.stream_buffer), self.stream_voice
                    )
                    if self.audio_started:
                        await self.write_event(AudioStop().event())
                    await self.write_event(SynthesizeStopped().event())
                    self.streaming = False
                    self.stream_buffer = ""
                    self.stream_voice = None
                    self.audio_started = False
                    return True

                return True
            except Exception as err:
                LOGGER.exception("Kokoro-SV synthesis failed")
                await self.write_event(
                    Error(text=str(err), code=err.__class__.__name__).event()
                )
                return True

        def resolve_voice(self, requested_voice):
            voice = DEFAULT_VOICE
            if requested_voice and requested_voice.name:
                voice = requested_voice.name
            if voice not in self.voices:
                raise ValueError(f"Unknown voice: {voice}")
            return voice

        async def synthesize_segments(self, segments, requested_voice):
            if not segments:
                return

            voice = self.resolve_voice(requested_voice)
            if not self.audio_started:
                await self.write_event(
                    AudioStart(rate=SAMPLE_RATE, width=2, channels=1).event()
                )
                self.audio_started = True

            for text in segments:
                started = time.monotonic()
                async with SYNTHESIS_LOCK:
                    audio = await asyncio.to_thread(
                        self.tts.synthesize, text, voice=voice, speed=1.0
                    )
                audio = trim_edge_silence(audio)

                pcm = (
                    np.clip(np.asarray(audio, dtype=np.float32), -1.0, 1.0)
                    * 32767.0
                ).astype("<i2").tobytes()
                elapsed = time.monotonic() - started
                LOGGER.info(
                    "Synthesized voice=%s chars=%d audio=%.2fs elapsed=%.2fs",
                    voice,
                    len(text),
                    len(pcm) / 2 / SAMPLE_RATE,
                    elapsed,
                )

                for offset in range(0, len(pcm), 16384):
                    await self.write_event(
                        AudioChunk(
                            audio=pcm[offset : offset + 16384],
                            rate=SAMPLE_RATE,
                            width=2,
                            channels=1,
                        ).event()
                    )


    async def main():
        import torch

        torch_threads = int(os.getenv("KOKORO_SV_THREADS", "6"))
        torch.set_num_threads(torch_threads)
        torch.set_num_interop_threads(1)
        LOGGER.info("PyTorch threads: %d", torch_threads)
        tts = await asyncio.to_thread(SwedishKokoro)
        voices = tuple(tts.voices)
        if DEFAULT_VOICE not in voices:
            raise ValueError(f"Default voice {DEFAULT_VOICE} is unavailable")

        attribution = Attribution(
            name="Joakim Eriksson",
            url="https://github.com/joakimeriksson/kokoro-sv",
        )
        info = Info(
            tts=[
                TtsProgram(
                    name="kokoro-sv",
                    description="Swedish Kokoro-82M voices",
                    attribution=attribution,
                    installed=True,
                    version="0.1.3",
                    voices=[
                        TtsVoice(
                            name=voice,
                            description=f"Kokoro-SV: {voice}",
                            attribution=attribution,
                            installed=True,
                            version="0.1.3",
                            languages=["sv"],
                        )
                        for voice in voices
                    ],
                    supports_synthesize_streaming=True,
                )
            ]
        )
        LOGGER.info("Available voices: %s", ", ".join(voices))

        server = AsyncServer.from_uri("tcp://0.0.0.0:10200")
        await server.run(partial(KokoroEventHandler, tts, voices, info))


    if __name__ == "__main__":
        asyncio.run(main())
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wyoming-kokoro-sv-data
  namespace: home-automation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
  storageClassName: local
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wyoming-kokoro-sv
  namespace: home-automation
spec:
  interval: 30m
  timeout: 20m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: cozy-fluxcd
  values:
    controllers:
      wyoming-kokoro-sv:
        strategy: Recreate
        annotations:
          configmap.reloader.stakater.com/reload: wyoming-kokoro-sv
        pod:
          labels:
            home-ops.myk8s.se/config-revision: "2"
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          install:
            image:
              repository: docker.io/library/python
              tag: 3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
            command:
              - sh
              - -ec
              - |
                marker=/data/venv/.kokoro-sv-0.1.3-wyoming-1.10.2-cpu1
                if [ ! -f "$marker" ]; then
                  python -m venv --clear /data/venv
                  /data/venv/bin/pip install --no-cache-dir \
                    'torch==2.14.1+cpu' \
                    --index-url https://download.pytorch.org/whl/cpu
                  /data/venv/bin/pip install --no-cache-dir \
                    'kokoro-sv==0.1.3' \
                    'wyoming==1.10.2'
                  touch "$marker"
                fi
                chown -R 1000:1000 /data
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
            command:
              - /data/venv/bin/python
              - /app/server.py
            env:
              TZ: ${TZ}
              HF_HOME: /data/huggingface
              HF_HUB_DISABLE_TELEMETRY: "1"
              KOKORO_SV_DEFAULT_VOICE: Stina
              KOKORO_SV_THREADS: "6"
              OMP_NUM_THREADS: "6"
              MKL_NUM_THREADS: "6"
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10200
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 180
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10200
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10200
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 12
            resources:
              requests:
                cpu: 1
                memory: 2Gi
              limits:
                cpu: 6
                memory: 6Gi
    service:
      app:
        controller: wyoming-kokoro-sv
        type: ClusterIP
        ports:
          wyoming:
            port: 10200
            protocol: TCP
            targetPort: 10200
    persistence:
      data:
        enabled: true
        existingClaim: wyoming-kokoro-sv-data
        globalMounts:
          - path: /data
      server:
        type: configMap
        name: wyoming-kokoro-sv
        globalMounts:
          - path: /app/server.py
            subPath: server.py
            readOnly: true
