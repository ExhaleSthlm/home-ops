---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wyoming-pianissimo-data
  namespace: home-automation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wyoming-pianissimo
  namespace: home-automation
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: cozy-fluxcd
  values:
    controllers:
      wyoming-pianissimo:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/tboby/wyoming-onnx-asr
              tag: v0.5.0@sha256:9b2ccdd52c7aa83e36a2d674de749c4c01bd6bb1e23ea45dd85befb9fc013340
            args:
              - --model-multilingual
              - KlangAI/pianissimo-sv-onnx
              - --quantization
              - int8
              - --device
              - cpu
              - --uri
              - tcp://0.0.0.0:10300
              - --model-dir
              - /data
            env:
              TZ: ${TZ}
              HF_HOME: /data/huggingface
              HF_HUB_DISABLE_TELEMETRY: "1"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10300
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 180
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10300
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10300
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 12
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: 4
                memory: 4Gi
    service:
      app:
        controller: wyoming-pianissimo
        type: LoadBalancer
        annotations:
          metallb.io/address-pool: cozystack
        loadBalancerIP: 192.168.222.124
        externalTrafficPolicy: Local
        ports:
          wyoming:
            port: 10300
            protocol: TCP
            targetPort: 10300
    persistence:
      data:
        enabled: true
        existingClaim: wyoming-pianissimo-data
        globalMounts:
          - path: /data
