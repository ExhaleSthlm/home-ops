---
apiVersion: v1
kind: Namespace
metadata:
  name: blocky
  labels:
    tenant.cozystack.io/tenant-root: ""
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
---
# App user credentials for the initial DB owner
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-blocky-db-creds
  namespace: blocky
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: blocky-db-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          reloader.stakater.com/auto: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /BLOCKY/CNPG_USERNAME
    - secretKey: password
      remoteRef:
        key: /BLOCKY/CNPG_PASSWORD
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/main/config/crd/bases/postgresql.cnpg.io_clusters.yaml
# CloudNativePG Cluster — creates a "blocky" database owned by user "blocky"
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: blocky-db
  namespace: blocky
spec:
  instances: 2
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backups
        serverName: blocky-db
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname #defaul value
    podAntiAffinityType: preferred

  # Use the operator's supported default image, or pin a version explicitly:
  # imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  storage:
    # Set your storageClass if needed (commented out to use cluster default)
    # storageClass: longhorn
    size: 5Gi

  # OPTIONAL: if you want postgres superuser access with a known password, set:
  # enableSuperuserAccess: true
  # superuserSecret:
  #   name: blocky-db-superuser

  bootstrap:
    initdb:
      database: blocky # database to create
      owner: blocky # owner of that database
      secret:
        name: blocky-db-creds # takes username/password from this Secret

  monitoring:
    enablePodMonitor: true
---
# webhook
# yaml-language-server: $schema=https://raw.githubusercontent.com/operator-framework/operator-lifecycle-manager/main/deploy/upstream/quickstart/crds/operators.operatorframework.io_clusterserviceversions.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: blocky-webhook
  namespace: blocky
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: blocky
      app.kubernetes.io/name: blocky
  namespaceSelector:
    matchNames: ["blocky"]
  endpoints:
    - port: doh
      path: /metrics
      interval: 30s
      honorLabels: true
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
---
# Grafana dashboard for Cert-Manager.
# not working - need troubleshooting...
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: blocky
  namespace: blocky
spec:
  allowCrossNamespaceImport: true
  folder: blocky
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: vm-longterm
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  url: "https://grafana.com/api/dashboards/13768/revisions/6/download"
  envs:
    - name: VAR_BLOCKY_URL
      value: "https://blocky.blocky.svc"

---
# Grafana datasource for Blocky Postgres database.
# yaml-language-server: $schema=https://raw.githubusercontent.com/grafana-operator/grafana-operator/main/config/crd/bases/grafana.integreatly.org_grafanadatasources.yaml
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: blocky-postgres
  namespace: blocky
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: blocky-postgres
    type: postgres
    isDefault: false
    url: blocky-db-ro.blocky.svc:5432
    database: blocky
    user: $username
    access: proxy
    jsonData:
      postgresVersion: 1500
      sslmode: disable
      timescaledb: false
    secureJsonData:
      password: $password
  valuesFrom:
    - targetPath: secureJsonData.password
      valueFrom:
        secretKeyRef:
          name: blocky-db-creds
          key: password
    - targetPath: user
      valueFrom:
        secretKeyRef:
          name: blocky-db-creds
          key: username
---
# Grafana dashboard for Blocky Postgres database.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: blocky-pg-dashboard
  namespace: blocky
spec:
  allowCrossNamespaceImport: true
  folder: blocky
  datasources:
    - inputName: DS_BLOCKY-POSTGRESQL
      datasourceName: blocky-postgres
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  url: "https://grafana.com/api/dashboards/17996/revisions/13/download"
---
# CiliumNetworkPolicy to allow Grafana ingress traffic (in tenant-root namespace) to access Blocky Postgres database.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-to-blockydb-ro
  namespace: tenant-root
spec:
  endpointSelector:
    matchLabels:
      app: grafana
  egress:
    - toServices:
        - k8sService:
            namespace: blocky
            serviceName: blocky-db-ro
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-ingress-from-grafana-to-blockydb
  namespace: blocky
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: blocky-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": tenant-root
            "k8s:app": grafana
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all
  namespace: blocky
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
