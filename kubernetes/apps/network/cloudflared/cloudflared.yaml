# Keep former ResourceSet children during its deletion; Flux apps now owns them.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
  annotations:
    fluxcd.controlplane.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cloudflare
  namespace: cozy-fluxcd
  labels:
    app.kubernetes.io/name: cloudflared
  annotations:
    fluxcd.controlplane.io/prune: disabled
spec:
  url: https://cloudflare.github.io/helm-charts
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-cloudflared-cloudflare-tunnel-remote
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
  annotations:
    fluxcd.controlplane.io/prune: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    # This secret name is automatically fetched by the Cloudflared helm chart.
    # Template: [namespace]-cloudflare-tunnel-remote
    name: cloudflared-cloudflare-tunnel-remote
    creationPolicy: Owner
    template:
      metadata:
        labels:
          reloader.stakater.com/auto: "true"
  data:
    - secretKey: tunnelToken
      remoteRef:
        key: /CLOUDFLARE/TUNNEL_TOKEN
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
  annotations:
    fluxcd.controlplane.io/prune: disabled
spec:
  interval: 10m
  chart:
    spec:
      chart: cloudflare-tunnel-remote
      version: "0.1.2"
      sourceRef:
        kind: HelmRepository
        name: cloudflare
        namespace: cozy-fluxcd
      interval: 10m
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"
    replicaCount: 2
    image:
      repository: docker.io/cloudflare/cloudflared
      tag: 2025.11.1@sha256:89ee50efb1e9cb2ae30281a8a404fed95eb8f02f0a972617526f8c5b417acae2
      pullPolicy: IfNotPresent
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
