# Ensures CNPG "alerta-db" has enough capacity for WAL retention and recovery.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: alerta-db
  namespace: tenant-root
spec:
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backups
        serverName: alerta-db
  storage:
    size: 30Gi
