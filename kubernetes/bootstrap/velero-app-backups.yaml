---
# Back up application state while excluding databases, NAS-backed media,
# model data, and caches that have separate backup paths or can be rebuilt.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-backup-resource-policy
  namespace: cozy-velero
data:
  policies.yaml: |
    version: v1
    volumePolicies:
      - conditions:
          pvcLabels:
            backup.myk8s.se/volume: "true"
        action:
          type: snapshot
      - conditions:
          pvcLabels:
            app: qdrant
        action:
          type: snapshot
      - conditions:
          nfs: {}
        action:
          type: skip
      - conditions:
          csi:
            driver: linstor.csi.linbit.com
        action:
          type: skip
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: apps-daily
  namespace: cozy-velero
spec:
  schedule: "0 3 * * *"
  template:
    includedNamespaces:
      - 3d-print
      - ai-automation
      - atuin
      - media
      - nextcloud
      - peanut
      - technitium-dns
    resourcePolicy:
      kind: ConfigMap
      name: app-backup-resource-policy
    storageLocation: default
    snapshotVolumes: true
    snapshotMoveData: true
    ttl: 336h
    itemOperationTimeout: 24h
