---
# CloudNativePG backups to Garage. Each namespace gets its own ObjectStore;
# serverName keeps clusters in separate prefixes within the namespace path.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-backups
  namespace: 3d-print
spec:
  retentionPolicy: 30d
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
  configuration:
    destinationPath: s3://postgres-backups/3d-print/
    endpointURL: ${GARAGE_ENDPOINT}
    s3Credentials:
      accessKeyId:
        name: postgres-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-backup-credentials
        key: ACCESS_SECRET_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
