---
# PostgreSQL backup credentials are projected into every namespace containing
# a direct CloudNativePG cluster. ObjectStore resources are added after the
# Barman Cloud plugin is supplied by the Cozystack upgrade.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: postgres-backup-credentials
spec:
  externalSecretName: es-postgres-backup-credentials
  namespaces:
    - 3d-print
    - ai-automation
    - authentik
    - blocky
    - local-dns
    - nextcloud
    - tenant-root
  refreshTime: 1m
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: infisical
    target:
      name: postgres-backup-credentials
      creationPolicy: Owner
      template:
        type: Opaque
        data:
          ACCESS_KEY_ID: "{{ .access_key }}"
          ACCESS_SECRET_KEY: "{{ .secret_key }}"
    data:
      - secretKey: access_key
        remoteRef:
          key: /POSTGRES/BACKUP_S3_ACCESS_KEY
      - secretKey: secret_key
        remoteRef:
          key: /POSTGRES/BACKUP_S3_SECRET_KEY
