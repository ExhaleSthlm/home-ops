---
apiVersion: v1
kind: Namespace
metadata:
  name: coder
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/instance: coder
    ingress.svc.egress: allow
---
apiVersion: v1
kind: Namespace
metadata:
  name: coder-workspaces
  labels:
    app.kubernetes.io/name: coder-workspaces
    app.kubernetes.io/instance: coder-workspaces
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-coder-db-creds
  namespace: coder
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: coder-db-creds
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          reloader.stakater.com/auto: "true"
      data:
        username: coder
        password: "{{ .password }}"
        CODER_PG_CONNECTION_URL: "postgresql://coder:{{ .password }}@coder-db-rw.coder.svc:5432/coder?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: /CODER/CNPG_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-coder-oidc
  namespace: coder
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: coder-oidc
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          reloader.stakater.com/auto: "true"
  data:
    - secretKey: CODER_OIDC_CLIENT_ID
      remoteRef:
        key: /CODER/OIDC_CLIENT_ID
    - secretKey: CODER_OIDC_CLIENT_SECRET
      remoteRef:
        key: /CODER/OIDC_CLIENT_SECRET
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: coder-db
  namespace: coder
spec:
  instances: 2
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backups
        serverName: coder-db
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
  storage:
    size: 10Gi
    storageClass: local
  bootstrap:
    initdb:
      database: coder
      owner: coder
      secret:
        name: coder-db-creds
  monitoring:
    enablePodMonitor: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: coder
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coder
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tenant-root
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: coder
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: coder-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cozy-postgres-operator
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coder-egress
  namespace: coder
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector: {}
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-gateway
      ports:
        - { protocol: TCP, port: 4000 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    - to:
        - ipBlock:
            cidr: 192.168.222.13/32
      ports:
        - { protocol: TCP, port: 30188 }
