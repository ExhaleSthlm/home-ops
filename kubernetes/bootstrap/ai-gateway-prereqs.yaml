---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-gateway
  labels:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/instance: ai-gateway
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-litellm-db-creds
  namespace: ai-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: litellm-db-creds
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          reloader.stakater.com/auto: "true"
      data:
        username: litellm
        password: "{{ .password }}"
        DATABASE_URL: "postgresql://litellm:{{ .password }}@litellm-db-rw.ai-gateway.svc:5432/litellm?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: /AI_GATEWAY/CNPG_PASSWORD
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-db
  namespace: ai-gateway
spec:
  instances: 2
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backups
        serverName: litellm-db
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
  storage:
    size: 5Gi
    storageClass: local
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
      secret:
        name: litellm-db-creds
  monitoring:
    enablePodMonitor: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-litellm-clients
  namespace: ai-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [ai-automation, coder, coder-workspaces]
      ports:
        - protocol: TCP
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: ai-gateway
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: litellm-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cozy-postgres-operator
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ai-gateway-egress
  namespace: ai-gateway
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-automation
      ports:
        - { protocol: TCP, port: 11434 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - ipBlock:
            cidr: 192.168.222.13/32
      ports:
        - { protocol: TCP, port: 30188 }
---
# Ollama is selected by restrictive namespace-wide policies in ai-automation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-litellm-to-ollama
  namespace: ai-automation
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-gateway
      ports:
        - { protocol: TCP, port: 11434 }
