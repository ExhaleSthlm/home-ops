---
# yaml-language-server: $schema=https://raw.githubusercontent.com/external-secrets/external-secrets/refs/heads/main/config/crds/bases/external-secrets.io_externalsecrets.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-cozy-backups-s3
  namespace: tenant-root
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cozy-backups-s3
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        accessKey: "{{ .access_key }}"
        secretKey: "{{ .secret_key }}"
        endpoint: http://192.168.222.13:30188
        bucketName: cozy-backups
  data:
    - secretKey: access_key
      remoteRef:
        key: /COZYSTACK/COZY_BACKUPS_ACCESS_KEY
    - secretKey: secret_key
      remoteRef:
        key: /COZYSTACK/COZY_BACKUPS_SECRET_KEY
